 {c:'yellow',t:'Жёлтый — лиды через раз',  x:'Есть просроченные касания на сегодня. Каждый второй лид пропускается.'},
 {c:'green', t:'Зелёный — лиды идут',      x:'Срочных задач и просроченных касаний нет.'},
 {c:'grey',  t:'Серый — вне распределения',x:'Смена не начата или завершена. Утром статус рассчитается заново.'}
];

var CAP=20, LEAD_DAY=8, AIR_PLAN=240, CARRY=9;
var started=false, done={}, openId=null, now=9*60+12, shiftSec=0, air=0;
var leadsGiven=0, leadsLost=0, cons=0, pays=0, leadTick=0, lead=null, tmr=null;
var G={now:'Сейчас',today:'Сегодня',wait:'Принимает решение'};

function live(){return T.filter(function(t){return !done[t.id]})}
function grp(g){return live().filter(function(t){return t.g===g})}
function lateList(){return grp('today').filter(function(t){return t.dl&&now>hm(t.dl)})}
function load(){return live().length+CARRY}
function color(){
  if(!started)return 'grey';
  if(load()>CAP||grp('now').length)return 'red';
  if(lateList().length)return 'yellow';
  return 'green';
}
function cur(){return openId?byId(openId):null}
function first(){var a=grp('now');if(a.length)return a[0];var b=grp('today');if(b.length)return b[0];
  var c=grp('wait');return c.length?c[0]:null}

/* ═══ ВЕРХНЯЯ СТРОКА ═══ */
function drawTop(){
  var c=color(),n=grp('now').length;
  var f1,f2;
  if(c==='grey'){f1='Не в очереди';f2=started?'смена завершена':'смена не начата'}
  else if(load()>CAP){f1='Лидов нет';f2='перегруз '+load()+' из '+CAP}
  else if(c==='red'){f1='Осталось '+n;f2='и пойдут лиды'}
  else if(c==='yellow'){var lk=lateList().length;f1='Лиды через раз';f2=lk+' '+pl(lk,'просроченное касание','просроченных касания','просроченных касаний')}
  else{f1='Лиды идут';f2='всё в сроке'}

  document.getElementById('top').innerHTML=
    '<div class="st'+(started?' on':'')+'"><i></i><div><b>'+(started?'В работе':'Не в работе')+'</b>'
      +'<span> · '+(started?hms(shiftSec):'смена не начата')+'</span></div></div>'
    +'<button class="flow '+c+'" onclick="openDay()"><span class="fv">'+f1+'</span><span class="fs">'+f2+'</span></button>'
    +'<div class="mtr">'
      +m('Нагрузка',load()+' <small>/'+CAP+'</small>',load()>CAP?'warn':'')
      +m('Лиды сегодня',leadsGiven+' <small>/'+LEAD_DAY+'</small>','','hide')
      +m('Эфирное время',Math.round(air/60)+' <small>/'+AIR_PLAN+' мин</small>','','hide')
    +'</div><span class="sp"></span><div class="tb">'
    +'<button class="btn ghost" onclick="openDay()">Мой день</button>'
    +(started?'<button class="btn '+(grp('now').length+grp('today').length?'red':'green')+'" onclick="finish()">Завершить день</button>'
             :'<button class="btn green" onclick="start()">▶ Начать работу</button>')
    +'</div>';
}
function m(l,v,cls,hide){return '<div class="m '+(hide||'')+'"><span class="ml">'+l+'</span>'
  +'<span class="mv '+(cls||'')+'">'+v+'</span></div>'}

/* ═══ ОЧЕРЕДЬ ═══ */
function drawQueue(){
  var h='';
  ['now','today','wait'].forEach(function(g){
    var l=grp(g),ic=g==='now'?'🔥':g==='today'?'🤝':'🎯';
    h+='<div class="qh"><i>'+ic+'</i>'+G[g]+'<b>'+l.length+'</b></div>';
    if(!l.length)h+='<div class="qe">✓ пусто</div>';
    else l.forEach(function(t){
      var late=(t.dl&&now>hm(t.dl));
      h+='<button class="q'+(g==='now'?' now':'')+(openId===t.id?' on':'')+'" onclick="openTask('+t.id+')">'
        +'<span class="n"><em>'+t.ic+'</em>'+t.name+'</span>'
        +'<span class="w">'+t.task+'</span>'
        +'<span class="d'+(late?' late':'')+'">'+(t.dl?(late?'просрочено с '+t.dl:'до '+t.dl):t.stage)+'</span></button>';
    });
  });
  document.getElementById('queue').innerHTML=h;
}

/* ═══ СДЕЛКА + ЗАДАЧА ═══ */
function drawDeal(){
  var t=cur(),d=document.getElementById('deal');
  if(!started){d.innerHTML=blank('Смена не начата','Нажми «Начать работу» — система поставит в очередь и сама откроет первую задачу.');return}
  if(!t){d.innerHTML=blank(live().length?'Выбери задачу слева':'Очередь выполнена',
    live().length?'Или нажми «Начать работу» ещё раз — система откроет первую по приоритету.':'Все задачи разобраны, можно завершать день.');return}

  var h='<div class="card"><div class="dhd"><h2>'+t.name+'</h2>'
    +'<span class="chip '+t.chip+'">'+t.stage+'</span><span class="id">Сделка '+t.deal+'</span></div>'
    +'<div class="kv">'
      +kv('Продукт','Банкротство физического лица')+kv('Стоимость',t.sum)
      +kv('Первый платёж',t.first)+kv('Ответственный','Скоробогатый Владислав')
    +'</div><div class="sys">✓ Сделка открыта системой — искать клиента и нажимать «Перейти» не нужно.</div></div>';

  h+='<div class="card"><div class="hh">История общения</div>';
  t.hist.forEach(function(e){
    h+='<div class="ev'+(e.t==='sig'?' sig':'')+'"><span class="ic">'+(e.t==='sig'?'⚡':e.t==='msg'?'💬':'☎')+'</span>'
      +'<div><div class="eh">'+e.h+'</div><div class="et">'+e.x+'</div></div></div>';
  });
  h+='</div>';

  h+='<div class="card task'+(t.g==='now'?'':' calm')+'">'
    +'<div class="tt"><h3>'+t.task+'</h3>'+(t.att?'<span class="att">попытка '+t.att+' из 3</span>':'')+'</div>'
    +'<div class="why">'+t.why+'</div>'
    +'<div class="done-when"><span class="lb">Готово, когда</span>'+t.when+'</div>'
    +'<div class="res">'
      +'<select class="pick" id="pick"><option value="">Выберите результат…</option>'
      +'<option value="ok">✅ Связались</option><option value="time">📅 Договорились на время</option>'
      +'<option value="no">📵 Не дозвонился</option><option value="err">⚠️ Ошибка системы</option></select>'
      +'<button class="btn dark" onclick="saveResult()">Сохранить и открыть следующую</button>'
    +'</div>'
    +'<div class="hint">Результат засчитается только после проверки события: клик по кнопке не считается — '
    +'нужен звонок из телефонии или подтверждённый диалог. Пока проверка не прошла, задача остаётся открытой.</div></div>';
  d.innerHTML=h;
}
function kv(k,v){return '<div><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'}
function blank(a,b){return '<div class="card"><h2 style="font-size:19px">'+a+'</h2>'
  +'<div class="why" style="margin-top:6px">'+b+'</div></div>'}

/* ═══ ЭКРАН «МОЙ ДЕНЬ» — один, вместо четырёх панелей ═══ */
function drawDay(){
  var c=color();
  document.getElementById('dTitle').textContent=
    c==='red'?(load()>CAP?'Перегруз':'Сначала срочное'):c==='yellow'?'Есть просроченные касания':
    c==='green'?'Всё в сроке':'Смена не идёт';
  document.getElementById('dSub').textContent=
    c==='red'?(load()>CAP?'Пока клиентов больше '+CAP+', новых лидов не будет':'Отработай срочные — и лиды пойдут'):
    c==='yellow'?'Каждый второй лид пропускается, пока есть просрочка':
    c==='green'?'Новые лиды приходят полностью':'Начни работу, чтобы попасть в распределение';

  var h='<div class="grid">'
    +cell('Срочно',grp('now').length,grp('now').length?'лиды остановлены':'чисто',grp('now').length?'bad':'ok')
    +cell('Сегодня',grp('today').length,lateList().length?lateList().length+' просрочено':'в сроке',lateList().length?'bad':'')
    +cell('Принимает решение',grp('wait').length,'касаемся последними','')
    +cell('Нагрузка',load()+' / '+CAP,load()>CAP?'перегруз':'есть запас',load()>CAP?'bad':'')
    +cell('Лиды сегодня',leadsGiven+' / '+LEAD_DAY,leadsLost?leadsLost+' упущено':'лимит дня','')
    +cell('Консультации',cons,'проведено','')
    +cell('Эфирное время',Math.round(air/60)+' / '+AIR_PLAN,'мин разговоров','')
    +cell('Смена',started?hms(shiftSec):'—','','')
    +'</div>';
  h+='<div class="rules"><h4>Почему лиды идут или не идут</h4>';
  RULES.forEach(function(r){h+='<div class="r '+r.c+'"><i></i><div><b>'+r.t+'</b><br>'+r.x+'</div></div>'});
  h+='</div>';
  document.getElementById('dBody').innerHTML=h;

  var mn=document.getElementById('dMain'),nt=document.getElementById('dNote');
  var debt=grp('now').length+grp('today').length;
  if(!started){mn.textContent='Начать работу';mn.className='btn green';nt.textContent='Пока смена не начата, задачи не подаются.'}
  else if(!live().length){mn.textContent='Завершить день';mn.className='btn green';nt.textContent='Очередь выполнена.'}
  else if(debt){mn.textContent='Завершить с долгом';mn.className='btn red';
    nt.textContent='Осталось '+debt+' на сегодня — итог уйдёт РОПу на разбор.'}
  else{mn.textContent='Вернуться в работу';mn.className='btn dark';nt.textContent='Срочного и просроченного нет.'}
}
function cell(l,v,s,cls){return '<div class="cell '+(cls||'')+'"><div class="cl">'+l+'</div>'
  +'<div class="cv">'+v+'</div><div class="cs">'+s+'</div></div>'}
function openDay(){document.getElementById('day').classList.add('on');drawDay()}
function closeDay(){document.getElementById('day').classList.remove('on')}
function mainAction(){
  if(!started){start();return}
  if(!live().length||grp('now').length+grp('today').length){finish();return}
  closeDay();
}

/* ═══ ДЕЙСТВИЯ ═══ */
function draw(){drawTop();drawQueue();drawDeal();if(document.getElementById('day').classList.contains('on'))drawDay()}
function start(){
  started=true;if(!tmr)tmr=setInterval(tick,1000);closeDay();
  var t=first();if(t)openId=t.id;draw();
  say('Работа начата','Система открыла первого клиента по приоритету. Искать никого не надо.');
}
function openTask(id){openId=id;closeDay();draw()}
function saveResult(){
  var t=cur();if(!t)return;
  var v=document.getElementById('pick').value;
  if(!v){say('Не выбран результат','Выберите результат из списка — без него задача не закроется.');return}
  if(v==='err'){
    done[t.id]=1;openId=null;var n1=first();if(n1)openId=n1.id;draw();
    say('Ошибка отправлена РОПу','Задача снята с вас. РОП разберёт, почему система её поставила.');return}
  if(v==='no'){
    t.att=(t.att||0)+1;
    if(t.att>=3){done[t.id]=1;say('Три попытки без ответа','Клиент переходит в «Недозвон», обязательная СМС отправлена.')}
    else say('Недозвон · попытка '+t.att+' из 3','PBX подтвердила исходящий, клиент не ответил. Следующая попытка поставлена автоматически.');
    openId=null;var n2=first();if(n2)openId=n2.id;draw();return}
  if(v==='time'){
    done[t.id]=1;openId=null;var n3=first();if(n3)openId=n3.id;draw();
    say('Договорённость зафиксирована','До согласованного времени клиент не считается просроченным.');return}
  /* связались — касание засчитано после проверки события */
  cons++;air+=Math.round(2.6*60);
  if(t.g==='now'&&t.ic==='⚡')pays++;
  done[t.id]=1;openId=null;var n4=first();if(n4)openId=n4.id;draw();
  say('Касание подтверждено','PBX: разговор 2 мин 34 сек. Задача закрыта, открыт следующий клиент'
    +(n4?': '+n4.name:'')+'.');
}
function finish(){
  var debt=grp('now').length+grp('today').length;
  started=false;openId=null;closeDay();draw();
  say(debt?'День завершён с долгом':'День завершён · очередь выполнена',
      debt?'Осталось '+debt+' на сегодня. Итоги сохранены для разбора с РОПом.'
          :'Консультаций '+cons+', эфирное время '+Math.round(air/60)+' мин.');
}

/* ═══ НОВЫЙ ЛИД ═══ */
function demoLead(){
  if(!started){say('Сначала начни работу','');return}
  if(color()==='red'){say('Лид не выдан','Пока есть срочные задачи, новые лиды не поступают.');return}
  if(color()==='yellow'){leadTick++;if(leadTick%2===0){say('Лид ушёл мимо','Жёлтый статус: каждый второй лид пропускается.');return}}
  if(leadsGiven>=LEAD_DAY){say('Дневной лимит исчерпан','Выдано '+LEAD_DAY+' лидов за смену — это потолок.');return}
  lead={name:'Наталья Иванова',left:300};
  document.getElementById('ldName').textContent=lead.name;
  document.getElementById('lead').classList.add('on');document.getElementById('ldTime').textContent=mmss(300);
}
function takeLead(){
  document.getElementById('lead').classList.remove('on');
  leadsGiven++;                       /* назначение считается, даже если звонок не состоялся */
  var t={id:100+leadsGiven,g:'now',ic:'🆕',name:lead.name,deal:'#2015'+(2600+leadsGiven),stage:'Новый лид',chip:'n',
    sum:'199 000 ₽',first:'13 500 ₽',task:'Позвонить новому клиенту',
    why:'Первый звонок нужно начать в течение 5 минут.',
    when:'Разговор от 1 минуты. Назначение уже вошло в дневной лимит.',
    hist:[{t:'sig',h:'Сигнал системы · только что',x:'Лид назначен на вас.'}]};
  T.push(t);lead=null;openId=t.id;draw();
  say('Лид взят: '+t.name,'Назначение вошло в дневной лимит ('+leadsGiven+' из '+LEAD_DAY+'), даже если звонок не состоится.');
}
function loseLead(){
  document.getElementById('lead').classList.remove('on');leadsLost++;lead=null;draw();
  say('Лид ушёл другому менеджеру','Пять минут вышли. Упущено за смену: '+leadsLost+' — это видно РОПу.');
}

/* ═══ ТАКТ ═══ */
function tick(){
  if(lead){lead.left--;document.getElementById('ldTime').textContent=mmss(lead.left);
    if(lead.left<=0){loseLead();return}}
  if(!started)return;
  shiftSec++;if(now<20*60&&shiftSec%5===0){now++;drawTop();drawQueue()}
  if(shiftSec%10===0)drawTop();
}
function setTime(m){now=m;draw();say('Сейчас '+clock(now),'')}

/* ═══ МЕЛОЧЬ ═══ */
function byId(id){for(var i=0;i<T.length;i++)if(T[i].id===id)return T[i];return null}
function hm(s){var a=s.split(':');return (+a[0])*60+(+a[1])}
function clock(m){return pad(Math.floor(m/60)%24)+':'+pad(m%60)}
function mmss(s){return pad(Math.floor(s/60))+':'+pad(s%60)}
function hms(s){return pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60)}
function pad(n){return (n<10?'0':'')+n}
function pl(n,a,b,c){var x=Math.abs(n)%100,y=x%10;return (x>10&&x<20)?c:(y>1&&y<5)?b:(y===1)?a:c}
function say(a,b){var e=document.getElementById('toast');e.innerHTML='<b>'+a+'</b>'+(b||'');
  e.className='on';clearTimeout(window.__t);window.__t=setTimeout(function(){e.className=''},5400)}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDay()});
draw();openDay();
</script>
